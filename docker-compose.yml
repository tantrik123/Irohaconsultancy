# ============================================================
# Iroha Educational Consultancy
# Joins realhrsoft-network so the shared nginx can proxy to it.
#
# irohaeduconsultancy.com      → iroha:6000      (frontend)
# mail.irohaeduconsultancy.com → iroha-api:6001  (email backend)
# ============================================================

name: iroha

networks:
  realhrsoft-network:
    external: true

services:

  iroha:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: https://mail.irohaeduconsultancy.com
    image: iroha-frontend:latest
    container_name: iroha
    restart: always
    ports:
      - "6000:6000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - realhrsoft-network

  iroha-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: iroha-api:latest
    container_name: iroha-api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "6001"
    expose:
      - "6001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - realhrsoft-network
